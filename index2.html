
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: black;
            font-family: Arial, sans-serif;
            color: white;
        }
        .papa {
            height: 100vh;
            background-image: url("BackGrounds/back2.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login {
            background-color: rgb(0, 0, 0, 0.85);
            width: 320px;
            padding: 35px;
            border: 1px solid #c9a646;
            border-radius: 10px;
        }
        h1{
            text-align: center;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: lightgray;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: #222;
            color: white;
            border: 1px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input:focus {
            border: 1px solid #d4af37;
            outline: none;
        }
        .forgot {
            display: block;
            text-align: right;
            color: #d4af37;
            text-decoration: none;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #c9a646;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #f0d77a;
        }
        .register {
            text-align: center;
            margin-top: 25px;
            color: lightgray;
        }
        .register a {
            color: #d4af37;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="papa">













        <div class="login">
            <h1>WELCOME BACK</h1>
            <p class="subtitle">
                Enter The World Of Real Madrid
            </p>

            <form>
  




                <label for="username">Login :</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >
                <label for="password">Password :</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <a href="#" class="forgot">
                    Forgot your password?
                </a>

                <button type="submit">LOGIN</button>

            </form>



            <p class="register">
                Not a member yet?
                <a href="#">Create an account</a>
            </p>

        </div>

    </div>

</body>
</html>
